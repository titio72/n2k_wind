; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_flags = -std=gnu++2a -Wall -Wextra
build_unflags = -std=gnu++11
upload_speed = 115200
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_type = debug
monitor_filters = esp32_exception_decoder
lib_deps = 
	ttlappalainen/NMEA2000-library
	https://github.com/jiauka/NMEA2000_esp32xx.git
	https://github.com/titio72/n2k_tools_libs.git

[env:esp32-c3-seeed]
platform = espressif32 @ 6.10.0
framework = arduino
board = seeed_xiao_esp32c3
build_type = release
upload_port = /dev/ttyACM0
monitor_port = ${env:esp32-c3-seeed.upload_port}
build_flags = 
	-D CAN_TX_PIN=GPIO_NUM_21
	-D CAN_RX_PIN=GPIO_NUM_20
	-D TEMP_PIN=-1
	-D SIN_PIN=GPIO_NUM_3
	-D COS_PIN=GPIO_NUM_2
	-D SPEED_PIN=GPIO_NUM_4
	-D LED_PIN=-1
	-D N2K_ENABLED=true
	-D TWAI_CAN_DRIVER

[env:esp32-s3-waveshare]
platform = espressif32
framework = arduino
board = esp32-s3-fh4r2_1
upload_port = /dev/ttyACM0
monitor_port = ${env:esp32-s3-waveshare.upload_port}
build_flags = 
	-D CAN_TX_PIN=GPIO_NUM_6
	-D CAN_RX_PIN=GPIO_NUM_7
	-D TEMP_PIN=-1
	-D SIN_PIN=GPIO_NUM_0
	-D COS_PIN=GPIO_NUM_1
	-D SPEED_PIN=GPIO_NUM_5
	-D LED_PIN=GPIO_NUM_21
	-D N2K_ENABLED=true
	-D TWAI_CAN_DRIVER

[env:esp32-c3-waveshare]
platform = espressif32
framework = arduino
board = esp32-c3-devkitc-02
upload_port = /dev/ttyACM0
monitor_port = ${env:esp32-c3-waveshare.upload_port}
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CAN_TX_PIN=GPIO_NUM_6
	-D CAN_RX_PIN=GPIO_NUM_7
	-D TEMP_PIN=-1
	-D SIN_PIN=GPIO_NUM_0
	-D COS_PIN=GPIO_NUM_1
	-D SPEED_PIN=GPIO_NUM_5
	-D LED_PIN=GPIO_NUM_10
	-D N2K_ENABLED=true
	-D TWAI_CAN_DRIVER

[env:test]
platform = native
test_build_src = yes
build_flags =
	-D NATIVE
	-D UNITY_INCLUDE_DOUBLE 
	-D UNITY_DOUBLE_PRECISION=1e-12